[package]
name = "polymer-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
polymer-composition.workspace = true
librashader = { workspace = true, features = ["presets", "preprocess"] }
polymer-banner = { workspace = true, features = ["render"] }
polymer-mipmap.workspace = true
actix.workspace = true
anyrender = "0.14.0"
blurhash = "0.2.3"
dashmap.workspace = true
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
rayon = "1.12.0"
percent-encoding = "2.3.2"
mime_guess = "2.0.5"
base64.workspace = true
blitz-dom = { git = "https://github.com/DioxusLabs/blitz", rev = "c3af502c03fd67e6c1861a55a22f28b093d435f7", features = ["custom-widget"] }
blitz-html = { git = "https://github.com/DioxusLabs/blitz", rev = "c3af502c03fd67e6c1861a55a22f28b093d435f7" }
blitz-net = { git = "https://github.com/DioxusLabs/blitz", rev = "c3af502c03fd67e6c1861a55a22f28b093d435f7" }
blitz-paint = { git = "https://github.com/DioxusLabs/blitz", rev = "c3af502c03fd67e6c1861a55a22f28b093d435f7", features = ["custom-widget"] }
blitz-traits = { git = "https://github.com/DioxusLabs/blitz", rev = "c3af502c03fd67e6c1861a55a22f28b093d435f7" }
arboard = "3.6.1"
clap = "4.6.1"
consolespec.workspace = true
kurbo = "0.13.1"
cursor-icon = "1.2.0"
keyboard-types = "0.7.0"
futures-util = "0.3.32"
futures = "0.3.32"
parking_lot.workspace = true
peniko = "0.6.1"
raw-window-handle.workspace = true
regex.workspace = true
rodio = { version = "0.22.2", default-features = false, features = ["playback", "flac", "mp3", "mp4", "vorbis", "wav"] }
serde.workspace = true
serde_bytes = "0.11"
serde_json.workspace = true
polymer-config.workspace = true
style = { package = "stylo", version = "0.22.0" }
style_dom = { package = "stylo_dom", version = "0.22.0" }
polymer-input.workspace = true

polymer-input-sdl3 = { path = "../../crates/input/polymer-input-sdl3" }
polymer-controllers.workspace = true
polymer-automation.workspace = true
polymer-bluetooth = { path = "../../crates/input/polymer-bluetooth" }
polymer-input-bluetooth = { path = "../../crates/input/polymer-input-bluetooth" }
polymer-ipc = { workspace = true, features = ["input-host"] }
polymer-library.workspace = true
polymer-pluginhost = { path = "../../crates/runtime/polymer-pluginhost" }
polymer-protocol.workspace = true
polymer-runtime.workspace = true
polymer-vfs.workspace = true
polymer-renderer = { path = "../../crates/consumer/polymer-renderer" }
polymer-statistics.workspace = true
tempfile.workspace = true
winit.workspace = true
deno_core = "0.412.0"
deno_error = "0.7.1"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
rustls = { version = "0.23.40", default-features = false, features = ["aws_lc_rs"] }
polymer-deno = { path = "../../crates/runtime/polymer-deno" }
tokio = { version = "1.53.0", features = ["full"] }
tokio-tungstenite = "0.29.0"
tracing.workspace = true
tracing-subscriber.workspace = true
uuid = "1.24.1"

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
polymer-composition-macos.workspace = true
polymer-platform-macos.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true
objc2-web-kit = "0.3.2"

[target.'cfg(windows)'.dependencies]
polymer-composition-windows.workspace = true
polymer-platform-windows.workspace = true
polymer-hook-input-dinput.workspace = true
windows.workspace = true
webview2-com = "0.39.1"
