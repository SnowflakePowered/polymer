[package]
name = "polymer-debug-viewer"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
polymer-vfs.workspace = true
polymer-vfs-winfsp.workspace = true
ash.workspace = true
egui = "0.29.1"
egui-winit = "0.29.1"
cssparser = "0.37"
cssparser-color = "0.5"
consolespec.workspace = true
parking_lot.workspace = true
raw-window-handle.workspace = true
regex.workspace = true
serde_json.workspace = true
polymer-config.workspace = true
taffy = { version = "0.12.2", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid", "parse"] }
polymer-renderer = { path = "../../crates/consumer/polymer-renderer" }
polymer-statistics.workspace = true
polymer-input.workspace = true
polymer-controllers.workspace = true

polymer-ipc = { workspace = true, features = ["input-host"] }
polymer-protocol.workspace = true
polymer-runtime.workspace = true
winit = "0.30.13"
tokio = { version = "1.32", features = ["rt-multi-thread", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
webrtc = "0.14.0"


[target.'cfg(target_os = "macos")'.dependencies]
polymer-renderer-metal = { path = "../../crates/consumer/polymer-renderer-metal" }
polymer-vfs-fskit.workspace = true
polymer-platform-macos.workspace = true

[target.'cfg(windows)'.dependencies]
polymer-renderer-vulkan = { path = "../../crates/consumer/polymer-renderer-vulkan" }
polymer-renderer-d3d12 = { path = "../../crates/consumer/polymer-renderer-d3d12" }
polymer-input-sdl3 = { path = "../../crates/input/polymer-input-sdl3" }
polymer-hook-input-dinput.workspace = true
polymer-platform-windows.workspace = true
windows.workspace = true
