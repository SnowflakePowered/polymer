[package]
name = "polymer-bttest"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
eframe = { version = "0.29.1", default-features = false, features = ["default_fonts", "glow"] }
gltf = "1.4.1"
polymer-bluetooth = { path = "../../crates/input/polymer-bluetooth" }
polymer-input-bluetooth = { path = "../../crates/input/polymer-input-bluetooth" }
polymer-input.workspace = true
polymer-library.workspace = true
serde_json.workspace = true
tokio = { version = "1.53", features = ["rt-multi-thread", "sync", "time"] }
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_System_Registry", "Win32_System_SystemInformation"] }

[lints]
workspace = true
