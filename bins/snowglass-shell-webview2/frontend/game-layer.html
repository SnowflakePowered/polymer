<!doctype html>
<!--
  The game layer: the backdrop and the boxes the guest frames are shown in.

  This is laid out and painted by the shell rather than by WebView2. A
  `<tracked-surface src="N">` is not painted at all: the compositor puts render
  target N there instead, sampling its swapchain directly, so the guest frame
  reaches the screen without passing through a renderer.

  `HTMLTrackedSurfaceElement` is a placement marker owned by this background
  document. The document runs in the shell's Deno runtime, so interaction and
  GameView launch setup are ordinary DOM code even though layout and painting
  remain native.

  Only what this layer needs has to work, so `position: fixed`, `position:
  sticky`, drawable canvas, and video are all absent by design — those belong
  to the foreground, which is still a browser.
-->
<html>
  <head>
    <style>
      :root, body, #root {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      * { box-sizing: border-box; }

      body {
        background-color: #181818;
        background-image:
          radial-gradient(circle, rgba(0, 0, 0, 0.9) 0 1px, transparent 1.35px),
          radial-gradient(circle, rgba(70, 70, 70, 0.55) 0 1px, transparent 1.35px);
        background-position: 0 0, 4px 4px;
        background-size: 8px 8px;
      }

      .surface-stage { position: absolute; inset: 0; }

      /* The TV output stays centered at its native aspect ratio. */
      .primary-surface {
        position: absolute;
        inset: 1.5rem 4rem;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: visible;
        z-index: 0;
      }

      .game-view {
        display: block;
        overflow: hidden;
        background: #050505;
      }

      .main-game-view {
        position: relative;
        max-width: 100%;
        max-height: 100%;
        border-radius: 4px;
        box-shadow:
          0 1.5rem 3.5rem rgba(0, 0, 0, 0.7),
          0 0.3rem 0.9rem rgba(0, 0, 0, 0.9);
      }

      /* Alt-Enter raises the second tracked surface as a plain bottom drawer.
         There is deliberately no Wii U controller bezel or hover treatment. */
      .gamepad-drawer {
        position: absolute;
        top: 100vh;
        left: 0;
        padding: 1.75rem 0.65rem 0.65rem;
        overflow: hidden;
        border-radius: 1rem;
        background: #171717;
        box-shadow:
          0 1.25rem 3rem rgba(0, 0, 0, 0.72),
          0 0.2rem 0.9rem rgba(0, 0, 0, 0.9);
        z-index: 20;
      }

      .gamepad-view {
        position: absolute;
        inset: 1.75rem 0.65rem 0.65rem;
        width: auto;
        height: auto;
        border-radius: 0.55rem;
      }

      .gamepad-drag-handle {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 1.75rem;
        cursor: move;
        z-index: 2;
      }

      .gamepad-drag-handle::after {
        content: "";
        position: absolute;
        top: 0.65rem;
        left: 50%;
        width: 3rem;
        height: 0.25rem;
        margin-left: -1.5rem;
        border-radius: 999px;
        background: #555;
      }

      .gamepad-resize-handle {
        position: absolute;
        right: 0;
        bottom: 0;
        width: 1.35rem;
        height: 1.35rem;
        border-right: 0.25rem solid #666;
        border-bottom: 0.25rem solid #666;
        cursor: nwse-resize;
        z-index: 3;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/game-layer.tsx"></script>
  </body>
</html>
