<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style id="gameview-style">
    :root, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }
    #stage {
      position: fixed;
      inset: 0;
    }
    #targets {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    .game-view-slot {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1 1 0;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }
    game-view-target {
      display: block;
      flex: none;
      background: transparent;
    }
    #status {
      position: fixed;
      left: 12px;
      bottom: 10px;
      color: rgba(255, 255, 255, .72);
      font: 12px/1.4 system-ui, sans-serif;
      pointer-events: none;
    }
  </style>
  <style id="snowglass-layer-style">
    html[data-snowglass-layer="foreground"],
    html[data-snowglass-layer="foreground"] body {
      background: transparent !important;
      background-image: none !important;
    }
    html[data-snowglass-layer="background"] [data-gameview-layer="foreground"],
    html[data-snowglass-layer="foreground"] [data-gameview-layer="background"] {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="background-root" data-gameview-layer="background"></div>
  <div id="stage" data-gameview-layer="foreground"><div id="targets"></div></div>
  <div id="status" data-gameview-layer="foreground">Waiting for a tracked render target…</div>
  <script>
    (() => {
      const layer = __WEBVIEW_LAYER_JSON__;
      document.documentElement.dataset.snowglassLayer = layer;

      const container = document.getElementById("targets");
      const status = document.getElementById("status");
      const layoutCss = __LAYOUT_CSS_JSON__;
      if (layoutCss) container.style.cssText += `;${layoutCss}`;

      let inputState = Object.freeze([]);
      let inputPriority = "game";
      const inputApi = Object.freeze({
        get controllers() {
          return inputState;
        },
        get priority() {
          return inputPriority;
        },
        set priority(value) {
          const priority = value === "foreground" ? "foreground" : "game";
          window.ipc.postMessage(JSON.stringify({
            type: "setInputPriority",
            priority,
          }));
        },
        postBackgroundMessage(message) {
          window.ipc.postMessage(JSON.stringify({
            type: "background",
            message,
          }));
        },
      });
      Object.defineProperty(window, "snowglassInput", {
        configurable: false,
        enumerable: true,
        value: inputApi,
        writable: false,
      });
      window.__snowglassSetInputState = (state, routed = []) => {
        inputState = Object.freeze(state.map(device => Object.freeze(device)));
        dispatchEvent(new CustomEvent("snowglassinputstate", {
          detail: inputState,
        }));
        for (const event of routed) {
          dispatchEvent(new CustomEvent("snowglassinput", {
            detail: Object.freeze(event),
          }));
        }
      };
      window.__snowglassSetInputPriority = priority => {
        inputPriority = priority;
        dispatchEvent(new CustomEvent("snowglassinputpriority", {
          detail: priority,
        }));
      };
      window.__snowglassKeyboardInput = event => {
        dispatchEvent(new CustomEvent("snowglassinput", {
          detail: Object.freeze(event),
        }));
      };
      window.__snowglassBackgroundMessage = message => {
        dispatchEvent(new MessageEvent("message", {
          data: message,
          origin: location.origin,
        }));
      };

      class GameViewTarget extends HTMLElement {
        #preferredSize = Object.freeze({ width: 0, height: 0 });

        get index() {
          return Number(this.dataset.index);
        }

        get preferredSize() {
          return this.#preferredSize;
        }

        setPreferredSize(value) {
          const width = Math.max(0, Number(value?.width) || 0);
          const height = Math.max(0, Number(value?.height) || 0);
          this.#preferredSize = Object.freeze({ width, height });
          this.style.setProperty("--preferred-width", `${width}px`);
          this.style.setProperty("--preferred-height", `${height}px`);
          this.style.setProperty("--preferred-aspect-ratio", width && height ? `${width} / ${height}` : "auto");
          scheduleLayout();
        }
      }
      customElements.define("game-view-target", GameViewTarget);

      let scheduled = false;
      const scheduleLayout = () => {
        if (scheduled) return;
        scheduled = true;
        requestAnimationFrame(() => {
          scheduled = false;
          const scale = window.devicePixelRatio || 1;
          const layouts = [...container.children].map(slot => {
            const element = slot.firstElementChild;
            const bounds = slot.getBoundingClientRect();
            const preferred = element.preferredSize;
            let width = bounds.width;
            let height = bounds.height;
            if (width > 0 && height > 0 && preferred.width > 0 && preferred.height > 0) {
              const fitScale = Math.min(
                width / preferred.width,
                height / preferred.height,
              );
              width = preferred.width * fitScale;
              height = preferred.height * fitScale;
            }
            element.style.width = `${width}px`;
            element.style.height = `${height}px`;
            const rect = element.getBoundingClientRect();
            return {
              connection: Number(element.dataset.connection),
              x: Math.round(rect.left * scale),
              y: Math.round(rect.top * scale),
              width: Math.max(0, Math.round(rect.width * scale)),
              height: Math.max(0, Math.round(rect.height * scale)),
            };
          });
          if (layer === "foreground") {
            try {
              chrome.webview.hostObjects.sync.snowglass.setViewports(JSON.stringify(layouts));
            } catch (error) {
              console.error("Snowglass layout bridge failed", error);
            }
          }
        });
      };

      const resizeObserver = new ResizeObserver(scheduleLayout);
      resizeObserver.observe(container);
      addEventListener("resize", scheduleLayout);
      addEventListener("scroll", scheduleLayout, true);

      window.__snowglassSetTargets = targets => {
        const existing = new Map(
          [...container.children].map(slot => {
            const element = slot.firstElementChild;
            return [element.dataset.connection, { slot, element }];
          })
        );
        for (const target of targets) {
          const key = String(target.connection);
          let entry = existing.get(key);
          if (!entry) {
            const slot = document.createElement("div");
            slot.className = "game-view-slot";
            slot.dataset.connection = key;
            const element = document.createElement("game-view-target");
            element.dataset.connection = key;
            slot.append(element);
            entry = { slot, element };
            resizeObserver.observe(slot);
          } else {
            existing.delete(key);
          }
          const { slot, element } = entry;
          element.dataset.index = String(target.index);
          element.id = `game-view-target-${target.index}`;
          element.setPreferredSize({ width: target.width, height: target.height });
          container.append(slot);
        }
        for (const { slot } of existing.values()) {
          resizeObserver.unobserve(slot);
          slot.remove();
        }
        status.hidden = targets.length !== 0;
        scheduleLayout();
      };
    })();
  </script>
</body>
</html>
