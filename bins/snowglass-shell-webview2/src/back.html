<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root, body, #background-root {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #555;
    }
  </style>
</head>
<body>
  <div id="background-root"></div>
  <script>
    window.__snowglassBackgroundMessage = message => {
      dispatchEvent(new MessageEvent("message", {
        data: message,
        origin: location.origin,
      }));
    };
  </script>
</body>
</html>
