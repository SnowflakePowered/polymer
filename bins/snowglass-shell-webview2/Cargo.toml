[package]
name = "snowglass-shell-webview2"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyrender = "0.11.1"
anyrender_vello = "0.11.0"
blitz-dom = { version = "0.3.0-beta.1", features = ["custom-widget", "incremental"] }
blitz-html = "0.3.0-beta.1"
blitz-net = "0.3.0-beta.1"
blitz-paint = { version = "0.3.0-beta.1", features = ["custom-widget"] }
blitz-traits = "0.3.0-beta.1"
arboard = "3.6.1"
clap = "4.6.1"
consolespec.workspace = true
egui = "0.29.1"
egui-winit = "0.29.1"
kurbo = "0.13.1"
cursor-icon = "1.2.0"
keyboard-types = "0.7.0"
parking_lot.workspace = true
pollster = "0.4"
peniko = "0.6.1"
raw-window-handle.workspace = true
regex.workspace = true
serde.workspace = true
serde_bytes = "0.11"
serde_json.workspace = true
style = { package = "stylo", version = "0.19.0" }
snowglass-input.workspace = true
snowglass-input-dinput.workspace = true
snowglass-ipc.workspace = true
snowglass-config.workspace = true
snowglass-platform-windows.workspace = true
snowglass-pluginhost = { path = "../../crates/runtime/snowglass-pluginhost" }
snowglass-protocol.workspace = true
snowglass-runtime.workspace = true 
snowglass-renderer = { path = "../../crates/consumer/snowglass-renderer" }
snowglass-egui.workspace = true
snowglass-statistics.workspace = true
tempfile.workspace = true
windows = { workspace = true, features = [
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Media",
    "Win32_System_Com",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_Input_KeyboardAndMouse",
] }
windows-core.workspace = true
winit = "0.30.13"
vello = "0.9"
vello_encoding = "0.9"
# Vello rasterises through wgpu, but the compositor samples plain D3D12. The
# HAL is how the texture Vello draws into is also a resource we can share.
wgpu-hal = { version = "29", features = ["dx12"] }
# The version wgpu-hal is built against. Its D3D12 types are distinct from the
# workspace's newer `windows`, so the two meet at a shared HANDLE rather than
# at a COM interface.
windows-wgpu = { package = "windows", version = "0.62", features = [
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi_Common",
] }
winapi = { version = "0.3.9", features = ["errhandlingapi"] }
deno_core = "0.409.0"
deno_error = "0.7.1"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
rustls = { version = "0.23.40", default-features = false, features = ["aws_lc_rs"] }
snowglass-deno = { path = "../../crates/runtime/snowglass-deno" }
tokio = { version = "1.53.0", features = ["full"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
