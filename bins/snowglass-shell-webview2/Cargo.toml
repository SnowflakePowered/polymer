[package]
name = "snowglass-shell-webview2"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyrender = "0.6.2"
anyrender_vello = "0.6.2"
blitz-dom = "0.2.4"
blitz-html = "0.2.0"
blitz-paint = "0.2.1"
blitz-traits = "0.2.0"
clap = "4.6.1"
egui = "0.29.1"
egui-winit = "0.29.1"
kurbo = "0.12"
parking_lot.workspace = true
peniko = "0.5.0"
raw-window-handle.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
style = { package = "stylo", version = "0.8.0" }
snowglass-input.workspace = true
snowglass-input-dinput.workspace = true
snowglass-ipc.workspace = true
snowglass-platform-windows.workspace = true
snowglass-protocol.workspace = true
snowglass-runtime = { path = "../../crates/snowglass-runtime" }
snowglass-renderer = { path = "../../crates/consumer/snowglass-renderer" }
snowglass-egui.workspace = true
snowglass-statistics.workspace = true
tempfile.workspace = true
webview2-com = "0.38"
windows = { workspace = true, features = [
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Media",
    "Win32_System_Com",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
] }
windows-core.workspace = true
winit = "0.30.13"
wry = { path = "../../../wry", default-features = false, features = ["os-webview", "transparent"] }
pollster = "0.4"
vello = "0.6"
# Vello rasterises through wgpu, but the compositor samples plain D3D12. The
# HAL is how the texture Vello draws into is also a resource we can share.
wgpu-hal = { version = "26", features = ["dx12"] }
# The version wgpu-hal is built against. Its D3D12 types are distinct from the
# workspace's newer `windows`, so the two meet at a shared HANDLE rather than
# at a COM interface.
windows-wgpu = { package = "windows", version = "0.58", features = [
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi_Common",
] }
deno_core = "0.409.0"
deno_runtime = { version = "0.264.0", features = ["transpile"] }
deno_semver = "=0.10.1"
node_resolver = { version = "0.94.0", features = ["sync"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
rustls = { version = "0.23.40", default-features = false, features = ["aws_lc_rs"] }
sys_traits = { version = "0.1.28", features = ["real", "winapi"] }
tokio = { version = "1.53.0", features = ["full"] }

[build-dependencies]
serde_json.workspace = true
swc = { version = "72.0.1", default-features = false }
swc_common = "24.0.0"

[lints]
workspace = true
