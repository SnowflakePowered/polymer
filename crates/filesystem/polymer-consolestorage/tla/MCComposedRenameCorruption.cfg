SPECIFICATION CorruptionSpec
CONSTANTS
  Layers <- MCLayers
  Durable <- MCDurable
  Paths <- MCPaths
  Owner <- MCOwner
  FilePaths <- MCFilePaths
  RenameOps <- MCCopy
  InitNs <- MCInitNs
  ResetNs <- MCResetNs
  Handles <- MCHandles
  Writable <- MCHandles
  OpenPaths <- MCAllOpen
  CreatePaths = {}
  ReplacePaths <- MCReuse
  MaxObjs = 5
  MaxWrites = 2
  MaxRenames = 1
  MaxCrashes = 1
  MaxFailures = 1
  LockIO = TRUE
  StableHandles = TRUE
  Journaled = TRUE
  RemoveFirst = FALSE
  MaxCorruptions = 1
  CheckPayload = TRUE
INVARIANTS CorruptionTypeOK AckedWritesVisible HandleFollowsFile OpenHandleIdentity NoDuplicateFile NoStagedLeftover
  WritesRespectAccess PreparedDestinationUnchanged JournalRetained RecoveryOrBlocked NoCorruptPublication CorruptionBlocked
PROPERTY RecoveryAfterRepair

