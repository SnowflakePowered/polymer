[package]
name = "polymer-consolestorage"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[lib]
path = "lib.rs"

[dependencies]
async-trait.workspace = true
aes = "0.8.4"
cbc = "0.1.2"
ctr = "0.9.2"
flate2 = "1"
hmac = "0.12.1"
tar = "0.4"
atomic-write-file.workspace = true
thiserror.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "tga"] }
base64.workspace = true
jiff = { version = "0.2.35", features = ["serde"] }
walkdir = "2.5.0"
tokio = { version = "1.53.0", features = ["fs", "io-util", "rt", "sync", "time"] }
vfs = "0.13.0"
quick-xml = { version = "0.39.4", features = ["serialize"] }
serde.workspace = true
serde_json.workspace = true
sha1 = "0.10.6"
futures = { version = "0.3", features = []}
gix.workspace = true
blake3 = { workspace = true, features = ["rayon"] }
encoding_rs = "0.8.35"
bitflags = "2.13.1"
uuid = { version = "1.24.1", features = ["serde", "v4", "v7"] }
parking_lot.workspace = true
zerocopy.workspace = true
phf.workspace = true
orbis-unpkg = "0.1.1"
pkgrip = "2.0.0"
csis = "0.1.0"
sha2 = "0.10.9"

gltf = "1.4.1"
zenwebp = "0.4.4"

[build-dependencies]
phf_codegen.workspace = true
serde.workspace = true
toml.workspace = true

