[package]
name = "snowglass-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# pin to force prebuild nasm feature
aws-lc-rs = { version = "=1.16.3", features = ["prebuilt-nasm"] }
axum = "0.8.8"
base64.workspace = true
blake3 = { workspace = true, features = ["traits-preview"] }
crossfire.workspace = true
consolespec.workspace = true
dashmap.workspace = true
gumshoe.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
object_store.workspace = true
parking_lot.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
snowglass-config.workspace = true
snowglass-command.workspace = true
snowglass-consolestorage = { path = "../../filesystem/snowglass-consolestorage" }
snowglass-deno = { path = "../snowglass-deno" }
snowglass-hook.workspace = true
snowglass-input.workspace = true
snowglass-input-layout.workspace = true
snowglass-input-ipc.workspace = true
snowglass-controllers.workspace = true
snowglass-input-bluetooth = { path = "../../input/snowglass-input-bluetooth" }
snowglass-library.workspace = true
snowglass-ipc.workspace = true
snowglass-platform-windows.workspace = true
snowglass-pluginhost = { path = "../snowglass-pluginhost" }
snowglass-protocol.workspace = true
snowglass-statistics.workspace = true
snowglass-vfs.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { version = "1.53.0", features = ["macros", "net", "rt", "sync", "time"] }
tracing.workspace = true
url = "2"
uuid = "1.24.1"
watchable.workspace = true
winapi = { version = "0.3.9", features = ["errhandlingapi"] }

[lints]
workspace = true

[dev-dependencies]
reqwest = { version = "0.13.1", default-features = false }
