[package]
name = "polymer-ipc"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Host publication services are excluded from transport-only hook builds.
input-host = ["dep:bincode", "dep:parking_lot", "dep:polymer-input", "dep:polymer-controllers", "dep:tracing", "dep:tokio"]

[dependencies]
bincode = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
polymer-input = { workspace = true, optional = true }
polymer-controllers = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tokio = { version = "1.53", features = ["io-util", "macros", "net", "rt", "sync", "time"], optional = true }
serde.workspace = true
serde_json.workspace = true
bcast.workspace = true
memmap2.workspace = true
tempfile.workspace = true
polymer-protocol.workspace = true

zerocopy.workspace = true

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["block2", "libc"] }
objc2-metal = "0.3.2"
objc2-io-surface = "0.3.2"
block2.workspace = true
libc = "0.2"
dashmap.workspace = true

[build-dependencies]
cc = "1"
