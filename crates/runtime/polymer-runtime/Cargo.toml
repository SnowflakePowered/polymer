[package]
name = "polymer-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
actix.workspace = true
dunce = "1"
notify-debouncer-full.workspace = true
walkdir = "2.5.0"
# pin to force prebuild nasm feature
aws-lc-rs = { version = "=1.16.3", features = ["prebuilt-nasm"] }
base64.workspace = true
blake3 = { workspace = true, features = ["traits-preview"] }
crossfire.workspace = true
consolespec.workspace = true
dashmap.workspace = true
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
object_store.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
polymer-config.workspace = true
polymer-consolestorage = { path = "../../filesystem/polymer-consolestorage" }
polymer-deno = { path = "../polymer-deno" }
polymer-input.workspace = true

polymer-controllers.workspace = true
polymer-input-bluetooth = { path = "../../input/polymer-input-bluetooth" }
polymer-library.workspace = true
polymer-scraping.workspace = true
polymer-ipc = { workspace = true, features = ["input-host"] }
polymer-platform.workspace = true
polymer-pluginhost = { path = "../polymer-pluginhost" }
polymer-protocol.workspace = true
polymer-statistics.workspace = true
polymer-vfs.workspace = true
thiserror.workspace = true
tokio = { version = "1.53.0", features = ["macros", "net", "rt", "sync", "time"] }
tracing.workspace = true
url = "2"
uuid = "1.24.1"
watchable.workspace = true

[target.'cfg(windows)'.dependencies]
polymer-consumer-d3d12 = { path = "../../consumer/polymer-consumer-d3d12" }
polymer-platform-windows.workspace = true
polymer-vfs-winfsp.workspace = true

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true


[target.'cfg(target_os = "macos")'.dependencies]
polymer-consumer-metal = { path = "../../consumer/polymer-consumer-metal" }
polymer-platform-macos.workspace = true
polymer-vfs-fskit.workspace = true
