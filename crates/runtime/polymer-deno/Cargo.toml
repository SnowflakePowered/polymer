[package]
name = "polymer-deno"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "lib.rs"

[dependencies]
actix.workspace = true
deno_ast = { version = "0.53.3", features = ["transpiling"] }
deno_core = "0.412.0"
deno_error = "0.7.1"
deno_fetch = "0.283.0"
deno_features = "0.56.0"
deno_inspector_server = "0.33.0"
deno_net = "0.251.0"
deno_permissions = "0.118.0"
deno_telemetry = "0.81.0"
deno_tls = "0.246.0"
deno_web = "0.290.0"
deno_webidl = "0.259.0"
deno_websocket = "0.264.0"
consolespec.workspace = true
serde.workspace = true
serde_json.workspace = true
polymer-library.workspace = true
sys_traits = { version = "0.1.28", features = ["real", "winapi", "libc"] }
thiserror.workspace = true
tokio = { version = "1.53.0", features = ["fs", "sync", "time"] }
turso.workspace = true

[lints]
workspace = true
