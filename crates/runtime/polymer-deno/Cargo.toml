[package]
name = "polymer-deno"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "lib.rs"

[dependencies]
kameo.workspace = true
deno_ast = { version = "0.53.3", features = ["transpiling"] }
deno_core = "0.409.0"
deno_error = "0.7.1"
deno_fetch = "0.280.0"
deno_features = "0.53.0"
deno_inspector_server = "0.30.0"
deno_net = "0.248.0"
deno_permissions = "0.115.0"
deno_telemetry = "0.78.0"
deno_tls = "0.243.0"
deno_web = "0.287.0"
deno_webidl = "0.256.0"
deno_websocket = "0.261.0"
serde.workspace = true
serde_json.workspace = true
polymer-command.workspace = true
polymer-library.workspace = true
sys_traits = { version = "0.1.28", features = ["real", "winapi"] }
thiserror.workspace = true
tokio = { version = "1.53.0", features = ["fs", "sync", "time"] }
turso.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { version = "1.53.0", features = ["macros", "rt", "time"] }

[lints]
workspace = true
