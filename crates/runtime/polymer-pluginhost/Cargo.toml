[package]
name = "polymer-pluginhost"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "lib.rs"

[dependencies]
polymer-consolestorage = { path = "../../filesystem/polymer-consolestorage" }
uuid = { version = "1", features = ["v7"] }
polymer-protocol.workspace = true
consolespec.workspace = true
deno_core = "0.409.0"
deno_ast = { version = "0.53.3", features = ["transpiling"] }
deno_error = "0.7.1"
dashmap.workspace = true
glob = "0.3"
blake3.workspace = true
futures-util = "0.3.32"
percent-encoding = "2"
parking_lot.workspace = true
serde.workspace = true
serde_bytes = "0.11"
serde_json.workspace = true
semver = "1"
turso.workspace = true
reqwest = { version = "0.13.1", default-features = false, features = ["rustls"] }
polymer-config.workspace = true
actix.workspace = true
polymer-controllers.workspace = true
polymer-automation.workspace = true
polymer-deno = { path = "../polymer-deno" }
polymer-input.workspace = true

polymer-ipc.workspace = true
polymer-library.workspace = true
polymer-vfs.workspace = true
toml.workspace = true
toml-spanner = { version = "1", features = ["derive"] }
thiserror.workspace = true
tracing.workspace = true
tokio = { version = "1.53.0", features = ["rt", "rt-multi-thread", "sync"] }
url = "2"

[dev-dependencies]
tempfile.workspace = true
tokio = { version = "1.53.0", features = ["rt", "macros", "time"] }

[lints]
workspace = true
