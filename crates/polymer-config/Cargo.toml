[package]
name = "polymer-config"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Emulator configuration definitions and output formats for Polymer"

[dependencies]
toml-spanner = { version = "1", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
consolespec.workspace = true
indexmap = { version = "2" }
configparser = { version = "3.2", features = ["indexmap"] }
quick-xml = "0.39"
toml_edit = "0.25"
rust-yaml = { version = "1.1", default-features = false }
bml = "0.3.1"
rt-format = "0.3.1"
crc = "3.4"
uuid = "1.24"
petgraph = "0.8"
[lints]
workspace = true
