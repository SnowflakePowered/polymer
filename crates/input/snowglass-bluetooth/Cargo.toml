[package]
name = "snowglass-bluetooth"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aes = "0.8.4"
async-trait.workspace = true
btleplug = "0.12.0"
bytes = "1.10"
futures = "0.3.32"
nusb = { version = "0.2.7", features = ["tokio"] }
rand.workspace = true
tokio = { version = "1.47", features = ["macros", "rt", "sync", "time"] }
tracing.workspace = true
uuid = "1.22"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Devices_Bluetooth"] }

[lints]
workspace = true
