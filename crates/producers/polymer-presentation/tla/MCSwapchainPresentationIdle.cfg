\* Documents the Vulkan polling gap: Device::poll_retired runs only while the
\* application acquires, so PermitReturnsIdle is expected to be violated.
SPECIFICATION Spec
CONSTANTS
  N = 2
  MaxGen = 2
  MaxSeq = 2
  MaxLease = 3
  Latency = 1
  MaxFaults = 0
  CrashFault = FALSE
  DropFault = FALSE
  DeviceFault = FALSE
  IndeterminateFault = FALSE
  ViewerDeviceFault = FALSE
  VulkanPath = TRUE
  HostedLaunch = TRUE
PROPERTIES
  PermitReturnsIdle
