[package]
name = "polymer-presentation"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
producer = ["dep:polymer-ipc", "dep:polymer-platform-windows", "dep:windows", "dep:tracing"]

[dependencies]
regex.workspace = true
polymer-presentation-config.workspace = true
dashmap.workspace = true
polymer-ipc = { workspace = true, optional = true }
polymer-protocol.workspace = true
polymer-platform-windows = { workspace = true, optional = true }
windows = { workspace = true, optional = true, features = ["Win32_System_LibraryLoader"] }
tracing = { workspace = true, optional = true }

[lints]
workspace = true
