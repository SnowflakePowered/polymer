[workspace]
resolver = "2"
members = [
    "tests",
    "crates/polymer-config",
    "crates/producers/*",
    "crates/hooks/*",
    "crates/consumer/*",
    "crates/compositor/*",
    "crates/input/*",
    "crates/runtime/*",
    "crates/filesystem/*",
    "bins/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/polymer/polymer"
rust-version = "1.94"

[workspace.dependencies]
polymer-composition = { path = "crates/compositor/polymer-composition" }
polymer-composition-macos = { path = "crates/compositor/polymer-composition-macos" }
polymer-composition-windows = { path = "crates/compositor/polymer-composition-windows" }
actix = "=0.13.5"
polymer-presentation = { path = "crates/producers/polymer-presentation" }
async-trait = "0.1.89"
atomic-write-file = "0.3.1"
asar = { version = "0.3.0", default-features = false }
ash = { version = "0.38.0", default-features = false, features = ["loaded", "std"] }
ash-window = "0.13.0"
bcast = "0.0.29"
bincode = { version = "2", features = ["serde"] }
blake3 = "1"
base64 = "0.22"
crossfire = "3.1.19"
dashmap = "6.1.0"
exe = "0.5.7"
metrics = "0.24.6"
metrics-util = { version = "0.20.4", default-features = false }
parking_lot = "0.12.5"
rkyv = "0.8.18"
raw-window-handle = "0.6.2"
regex = "1.13"
sdl3 = { version = "0.18.4", features = ["hidapi"] }
seqlock = "0.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
ib-hook = { version = "0.2.2", default-features = false, features = ["inline"] }
libloading = "0.8.9"
memmap2 = "0.9.8"
rand = "0.10.0"
object_store = "0.14.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tempfile = "3.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
turso = { version = "0.8.0-pre.7", default-features = false }
watchable = "1.1.2"
winit = "0.29.15"
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_OpenGL",
    "Win32_Media_MediaFoundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Threading",
] }
windows-registry = "0.6.1"
windows-core = "0.61.2"
windows-strings = "0.5.1"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_OpenGL",
    "Win32_Globalization",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Performance",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Environment",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
] }
zerocopy = { version = "0.8.55", features = ["derive"] }
polymer-protocol = { path = "crates/runtime/polymer-protocol" }
polymer-ipc = { path = "crates/runtime/polymer-ipc" }
polymer-statistics = { path = "crates/runtime/polymer-statistics" }
polymer-ui = { path = "crates/runtime/polymer-ui" }
polymer-platform = { path = "crates/runtime/polymer-platform" }
polymer-platform-windows = { path = "crates/runtime/polymer-platform-windows" }
polymer-platform-macos = { path = "crates/runtime/polymer-platform-macos" }
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
objc2-core-audio = "0.3.2"
objc2-fs-kit = "0.3.2"
block2 = "0.6.2"
polymer-automation = { path = "crates/runtime/polymer-automation" }
polymer-input = { path = "crates/input/polymer-input" }
polymer-config = { path = "crates/polymer-config" }
polymer-hook-input-dinput = { path = "crates/hooks/polymer-hook-input-dinput" }
polymer-hook-input-sdl = { path = "crates/hooks/polymer-hook-input-sdl" }
polymer-hook-input-win32 = { path = "crates/hooks/polymer-hook-input-win32" }
polymer-hook-input = { path = "crates/hooks/polymer-hook-input" }
consolespec = { version = "0.0.2" }
gumshoe = { version = "0.0.5-beta" }
gix = { version = "0.86", features = ["tree-editor"] }
phf = "0.14"
phf_codegen = "0.14"
polymer-runtime = { path = "crates/runtime/polymer-runtime" }
polymer-controllers = { path = "crates/runtime/polymer-controllers" }
polymer-library = { path = "crates/runtime/polymer-library" }
polymer-scraping = { path = "crates/runtime/polymer-scraping" }
polymer-vfs = { path = "crates/filesystem/polymer-vfs" }
polymer-vfs-winfsp = { path = "crates/filesystem/polymer-vfs-winfsp" }
polymer-vfs-fskit = { path = "crates/filesystem/polymer-vfs-fskit" }

polymer-hook = { path = "crates/hooks/polymer-hook" }

thiserror = "2"
arrayref = "=0.3.4"
xa11y-core = { path = "../xa11y/xa11y-core" }
xa11y-macos = { path = "../xa11y/xa11y-macos" }
xa11y-windows = { path = "../xa11y/xa11y-windows" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.dev.package.aes]
opt-level = 3

[profile.dev.package.cbc]
opt-level = 3

[profile.dev.package.ctr]
opt-level = 3

[profile.dev.package.cipher]
opt-level = 3

[profile.dev.package.sha1]
opt-level = 3

[profile.dev.package.sha1-checked]
opt-level = 3

[profile.dev.package.sha1_smol]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.blake3]
opt-level = 3

[profile.dev.package.md-5]
opt-level = 3

[profile.dev.package.crc32fast]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.zlib-rs]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.csis]
opt-level = 3

[profile.dev.package.gix-features]
opt-level = 3

[profile.dev.package.gix-hash]
opt-level = 3

[profile.dev.package.gix-object]
opt-level = 3

[profile.dev.package.gix-odb]
opt-level = 3

[profile.dev.package.gix-pack]
opt-level = 3

[profile.dev.package.gix-index]
opt-level = 3

[profile.dev.package.gix-hashtable]
opt-level = 3

[patch.crates-io]
consolespec = { path = "../consolespec/consolespec" }
gumshoe = { path = "../gumshoe/gumshoe" }
