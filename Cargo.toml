[workspace]
resolver = "2"
members = [
    "crates/snowglass-config",
    "crates/producers/*",
    "crates/hooks/*",
    "crates/consumer/*",
    "crates/input/*",
    "crates/runtime/*",
    "crates/filesystem/*",
    "bins/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/snowglass/snowglass"
rust-version = "1.94"

[workspace.dependencies]
async-trait = "0.1.89"
atomic-write-file = "0.3.1"
asar = { version = "0.3.0", default-features = false }
ash = { version = "0.38.0", default-features = false, features = ["loaded", "std"] }
ash-window = "0.13.0"
bcast = "0.0.29"
crossfire = "3.1.19"
dashmap = "6.1.0"
exe = "0.5.7"
metrics = "0.24.6"
metrics-util = { version = "0.20.4", default-features = false }
parking_lot = "0.12.5"
rkyv = "0.8.18"
raw-window-handle = "0.6.2"
regex = "1.13"
sdl3 = { version = "0.18.4", features = ["hidapi"] }
seqlock = "0.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
ib-hook = { version = "0.2.2", default-features = false, features = ["inline"] }
memmap2 = "0.9.8"
rand = "0.10.0"
tempfile = "3.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
watchable = "1.1.2"
winit = "0.29.15"
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Direct3D11on12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_OpenGL",
    "Win32_Media_MediaFoundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Threading",
] }
windows-core = "0.61.2"
windows-strings = "0.5.1"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_OpenGL",
    "Win32_Globalization",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Performance",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Environment",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
] }
zerocopy = { version = "0.8.55", features = ["derive"] }
snowglass-api = { path = "crates/snowglass-api" }
snowglass-protocol = { path = "crates/runtime/snowglass-protocol" }
snowglass-ipc = { path = "crates/runtime/snowglass-ipc" }
snowglass-egui = { path = "crates/consumer/snowglass-egui" }
snowglass-statistics = { path = "crates/runtime/snowglass-statistics" }
snowglass-ui = { path = "crates/runtime/snowglass-ui" }
snowglass-platform-windows = { path = "crates/runtime/snowglass-platform-windows" }
snowglass-input = { path = "crates/input/snowglass-input" }
snowglass-config = { path = "crates/snowglass-config" }
snowglass-input-dinput = { path = "crates/input/snowglass-input-dinput" }
snowglass-input-sdl = { path = "crates/input/snowglass-input-sdl" }
snowglass-input-win32 = { path = "crates/input/snowglass-input-win32" }
consolespec = { version = "0.0.1" }
gumshoe = { version = "0.0.4-beta" }
phf = "0.14"
phf_codegen = "0.14"
snowglass-runtime = { path = "crates/runtime/snowglass-runtime" }
snowglass-library = { path = "crates/runtime/snowglass-library" }
snowglass-vfs = { path = "crates/filesystem/snowglass-vfs" }
snowglass-vfs-winfsp = { path = "crates/filesystem/snowglass-vfs-winfsp" }

snowglass-hook = { path = "crates/hooks/snowglass-hook" }

thiserror = "2"
arrayref = "=0.3.4"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
