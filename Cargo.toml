[workspace]
resolver = "2"
members = [
    "crates/snowglass-api",
    "crates/snowglass-protocol",
    "crates/snowglass-ipc",
    "crates/snowglass-platform-windows",
    "crates/snowglass-runtime",
    "crates/producers/*",
    "crates/hooks/*",
    "crates/consumer/*",
    "crates/input/*",
    "bins/*",
]
exclude = [
    "crates/hooks/snowglass-hook-input",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/snowglass/snowglass"
rust-version = "1.94"

[workspace.dependencies]
ash = { version = "0.38.0", default-features = false, features = ["loaded", "std"] }
ash-window = "0.13.0"
bcast = "0.0.29"
dashmap = "6.1.0"
raw-window-handle = "0.6.2"
regex = "1.13"
sdl3 = { version = "0.18.4", features = ["hidapi"] }
seqlock = "0.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
ib-hook = { version = "0.2.2", default-features = false, features = ["inline"] }
memmap2 = "0.9.8"
tempfile = "3.20"
winit = "0.29.15"
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Direct3D11on12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_OpenGL",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_System_Threading",
] }
windows-core = "0.61.2"
windows-strings = "0.5.1"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_OpenGL",
    "Win32_Globalization",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Performance",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Environment",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
] }
zerocopy = { version = "0.8.52", features = ["derive"] }
snowglass-api = { path = "crates/snowglass-api" }
snowglass-protocol = { path = "crates/snowglass-protocol" }
snowglass-ipc = { path = "crates/snowglass-ipc" }
snowglass-ui = { path = "crates/snowglass-ui" }
snowglass-platform-windows = { path = "crates/snowglass-platform-windows" }
snowglass-input = { path = "crates/input/snowglass-input" }
snowglass-input-dinput = { path = "crates/input/snowglass-input-dinput" }
snowglass-input-sdl = { path = "crates/input/snowglass-input-sdl" }
snowglass-input-win32 = { path = "crates/input/snowglass-input-win32" }
snowglass-hook = { path = "crates/hooks/snowglass-hook" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
