[plugin]
id = "ares"
version = "0.0.1"
class = "emulator"
api = "^0.1"
main = "ares.ts"

[plugin.permissions.net]
allowed-hosts = ["emulator-index.polymer.gg", "github.com", "release-assets.githubusercontent.com", "jsr.io"]

[[plugin.caches]]
key = "runtime"
label = "ares Runtime"

[plugin.config.channel]
display = "Update channel"
default = "stable"
choices = ["stable", "preview", "nightly"]

[[plugin.caches]]
key = "saves"
label = "Save files"

[emulator]
platforms = [
    "ATARI_2600",
    "BANDAI_WS",
    "BANDAI_WSC",
    "COLECO_CV",
    "NEC_SGFX",
    "NEC_TG16",
    "NEC_TGCD",
    "NINTENDO_FDS",
    "NINTENDO_GB",
    "NINTENDO_GBA",
    "NINTENDO_GBC",
    "NINTENDO_N64",
    "NINTENDO_N64DD",
    "NINTENDO_NES",
    "NINTENDO_SNES",
    "SEGA_32X",
    "SEGA_32X_CD",
    "SEGA_CD",
    "SEGA_GEN",
    "SEGA_GG",
    "SEGA_SAT",
    "SEGA_SG1000",
    "SEGA_SMS",
    "SNK_NG",
    "SNK_NGP",
    "SNK_NGPC",
    "SONY_PSX",
]

[emulator.configuration]
definitions = [
    "config/ares.toml",
    "config/firmware.toml",
    "config/input.toml",
    "config/sections/*.toml",
]
