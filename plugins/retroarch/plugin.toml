[plugin]
id = "retroarch-lrps2"
version = "0.0.1"
class = "emulator"
main = "retroarch.ts"

[plugin.permissions.net]
allowed-hosts = ["emulator-index.snowflakepowe.red", "buildbot.libretro.com", "jsr.io"]

[[plugin.caches]]
key = "runtime"
label = "RetroArch Runtime"

[plugin.config.channel]
display = "Update channel"
default = "stable"
choices = ["stable", "preview", "nightly"]

[emulator]
platforms = ["SONY_PS2"]

[emulator.configuration]
definitions = [
    "config/runtime.toml",
    "config/input.toml",
]
