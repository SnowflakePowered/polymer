[plugin]
id = "ppsspp"
version = "0.0.1"
class = "emulator"
api = "^0.1"
main = "ppsspp.ts"

[plugin.permissions.net]
allowed-hosts = ["emulator-index.snowflakepowe.red", "github.com", "release-assets.githubusercontent.com", "jsr.io"]

[[plugin.caches]]
key = "runtime"
label = "PPSSPP Runtime"

[plugin.config.channel]
display = "Update channel"
default = "stable"
choices = ["stable", "preview", "nightly"]

[[plugin.caches]]
key = "saves"
label = "PSP save data"

[emulator]
platforms = ["SONY_PSP"]

[emulator.configuration]
definitions = ["config/runtime.toml", "config/actions.toml", "config/input.toml"]

[emulator.savestates]
max = 10
revision = "1.20.4"
