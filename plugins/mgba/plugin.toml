[plugin]
id = "mgba"
version = "0.0.1"
class = "emulator"
main = "mgba.ts"

[[plugin.resources]]
name = "runtime"
target = "x86_64-pc-windows-msvc"
source = "pkg:bin/win-x64"
format = "directory"
mode = "rx"

[emulator]
platforms = ["NINTENDO_GBA"]

[emulator.configuration]
definitions = ["config/input.toml"]
