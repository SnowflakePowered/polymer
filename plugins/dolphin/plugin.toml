[plugin]
id = "dolphin"
version = "0.0.1"
class = "emulator"

[plugin.config]
dolphin_path = "file:///D:/emulators/dolphin/Dolphin-x64/Dolphin.exe"

[emulator]
platforms = ["NINTENDO_GCN", "NINTENDO_WII"]
main = "dolphin.ts"


[emulator.configuration]
definitions = [
    "config/dolphin.toml",
    "config/input.toml",
    "config/sections/main.toml",
    "config/sections/gfx.toml",
    "config/sections/gfx/*.toml",
]
resolver = "config/resolvers.ts"
