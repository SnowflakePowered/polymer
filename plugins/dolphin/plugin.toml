[plugin]
id = "dolphin"
version = "0.0.1"
class = "emulator"
main = "dolphin.ts"

[emulator]
platforms = ["NINTENDO_GCN", "NINTENDO_WII"]

[emulator.configuration]
definitions = [
    "config/dolphin.toml",
    "config/actions.toml",
    "config/input.toml",
    "config/sections/main.toml",
    "config/sections/gfx.toml",
    "config/sections/gfx/*.toml",
]

[emulator.savestates]
max = 10
revision = "2606"

[emulator.preflight.NINTENDO_WII.nand]
completion = "minimal"
