[plugin]
id = "dolphin"
version = "0.0.1"
class = "emulator"

[[plugin.resources]]
name = "runtime"
target = "x86_64-pc-windows-msvc"
source = "pkg:bin/win-x64"
format = "directory"
mode = "rx"

[emulator]
platforms = ["NINTENDO_GCN", "NINTENDO_WII"]
main = "dolphin.ts"

[emulator.configuration]
definitions = [
    "config/dolphin.toml",
    "config/actions.toml",
    "config/input.toml",
    "config/sections/main.toml",
    "config/sections/gfx.toml",
    "config/sections/gfx/*.toml",
]
resolver = "config/resolvers.ts"
