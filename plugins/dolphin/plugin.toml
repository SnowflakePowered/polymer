[plugin]
id = "dolphin"
version = "0.0.1"
class = "emulator"

[plugin.config]
# todo: make this path relative to package (i.e pkg://runtime/Cemu.exe)
cemu_path = "file://E:/Emulators/Dolphin/Cemu.exe"

[emulator]
platforms = ["NINTENDO_GCN", "NINTENDO_WII"]


[emulator.configuration]
definitions = [
    "config/dolphin.toml",
    "config/input.toml",
    "config/sections/main.toml",
    "config/sections/gfx.toml",
    "config/sections/gfx/*.toml",
]
resolver = "config/resolvers.ts"
