[plugin]
id = "dolphin"
version = "0.0.1"
class = "emulator"
api = "^0.1"
main = "dolphin.ts"

[plugin.permissions.net]
allowed-hosts = ["emulator-index.polymer.gg", "github.com", "release-assets.githubusercontent.com", "dl.dolphin-emu.org", "jsr.io"]

[[plugin.caches]]
key = "runtime"
label = "Dolphin Runtime"

[plugin.config.channel]
display = "Update channel"
default = "stable"
choices = ["stable", "preview", "nightly"]

[emulator]
platforms = ["NINTENDO_GCN", "NINTENDO_WII"]

[emulator.configuration]
definitions = [
    "config/dolphin.toml",
    "config/actions.toml",
    "config/input.toml",
    "config/logger.toml",
    "config/sections/main.toml",
    "config/sections/gfx.toml",
    "config/sections/gfx/*.toml",
]

[emulator.savestates]
max = 10
revision = "2606"
