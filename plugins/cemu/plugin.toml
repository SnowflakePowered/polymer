[plugin]
id = "cemu"
version = "0.0.1"
class = "emulator"
main = "cemu.ts"

[[plugin.caches]]
key = "shaderCache"
label = "Shader Cache"

[emulator]
platforms = ["NINTENDO_WIIU"]

[emulator.configuration]
definitions = [
    "config/cemu.toml",
    "config/input.toml",
    "config/sections/content.toml",
    "config/sections/content-*.toml",
    "config/sections/graphics-packs.toml"
]
