[plugin]
id = "cemu"
version = "0.0.1"
class = "emulator"

[[plugin.resources]]
name = "runtime"
target = "x86_64-pc-windows-msvc"
source = "pkg:bin/win-x64"
format = "directory"
mode = "rx"

[[plugin.resources]]
name = "graphicsPacks"
source = "pkg:bin/graphicsPacks"
format = "directory"
mode = "rx"

[[plugin.caches]]
key = "shaderCache"
label = "Shader Cache"

[emulator]
platforms = ["NINTENDO_WIIU"]
main = "cemu.ts"

[emulator.configuration]
definitions = [
    "config/cemu.toml",
    "config/input.toml",
    "config/sections/content.toml",
    "config/sections/content-*.toml",
    "config/sections/graphics-packs.toml"
]
