[plugin]
id = "cemu"
version = "0.0.1"
class = "emulator"
main = "cemu.ts"

[plugin.permissions.net]
allowed-hosts = ["emulator-index.snowflakepowe.red", "github.com", "release-assets.githubusercontent.com", "api.github.com", "jsr.io"]

[[plugin.caches]]
key = "runtime"
label = "Cemu Runtime"

[plugin.config.channel]
display = "Update channel"
default = "stable"
choices = ["stable", "preview", "nightly"]

[[plugin.caches]]
key = "shaderCache"
label = "Shader Cache"

[emulator]
platforms = ["NINTENDO_WIIU"]

[emulator.configuration]
definitions = [
    "config/cemu.toml",
    "config/input.toml",
    "config/sections/content.toml",
    "config/sections/content-*.toml",
    "config/sections/graphics-packs.toml"
]
