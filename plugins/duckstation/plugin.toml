[plugin]
id = "duckstation"
version = "0.0.1"
class = "emulator"
api = "^0.1"
main = "duckstation.ts"

[plugin.permissions.net]
allowed-hosts = ["emulator-index.snowflakepowe.red", "github.com", "release-assets.githubusercontent.com", "jsr.io"]

[[plugin.caches]]
key = "runtime"
label = "DuckStation Runtime"

[plugin.config.channel]
display = "Update channel"
default = "stable"
choices = ["stable", "preview", "nightly"]

[emulator]
platforms = ["SONY_PSX"]

[emulator.configuration]
definitions = [
    "config/duckstation.toml",
    "config/actions.toml",
    "config/runtime.toml",
    "config/input.toml",
    "config/sections/*.toml",
]
