[plugin]
id = "duckstation"
version = "0.0.1"
class = "emulator"

[plugin.config]
bios = "D:\\bios\\SCPH1001.BIN"

[[plugin.resources]]
name = "runtime"
target = "x86_64-pc-windows-msvc"
source = "pkg:bin/win-x64"
format = "directory"
mode = "rx"

[emulator]
platforms = ["SONY_PSX"]
main = "duckstation.ts"

[emulator.configuration]
definitions = [
    "config/duckstation.toml",
    "config/actions.toml",
    "config/runtime.toml",
    "config/input.toml",
    "config/sections/*.toml",
]
