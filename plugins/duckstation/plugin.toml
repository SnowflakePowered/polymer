[plugin]
id = "duckstation"
version = "0.0.1"
class = "emulator"
main = "duckstation.ts"

[emulator]
platforms = ["SONY_PSX"]

[emulator.configuration]
definitions = [
    "config/duckstation.toml",
    "config/actions.toml",
    "config/runtime.toml",
    "config/input.toml",
    "config/sections/*.toml",
]
