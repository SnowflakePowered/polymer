[targets.settings]
output = { format = "toml", path = "Ymir.toml" }

[sections.runtime]
title = "runtime"
target = "settings"

[[sections.runtime.options]]
key = "ConfigVersion"
title = "ConfigVersion"
type = "int"
default = 5
emit = { key = "ConfigVersion" }

[targets.settings."System"]

[sections.system]
title = "system"
target = "settings.System"

[[sections.system.options]]
key = "InternalBackupRAMImagePath"
title = "InternalBackupRAMImagePath"
type = "string"
default = ""
emit = { key = "InternalBackupRAMImagePath" }

[[sections.system.options]]
key = "InternalBackupRAMPerGame"
title = "InternalBackupRAMPerGame"
type = "bool"
default = false
emit = { key = "InternalBackupRAMPerGame" }

[targets.settings.System.IPL]

[sections.ipl]
title = "ipl"
target = "settings.System.IPL"

[[sections.ipl.options]]
key = "Override"
title = "Override"
type = "bool"
default = true
emit = { key = "Override" }

[[sections.ipl.options]]
key = "Path"
title = "Path"
type = "string"
default = ""
emit = { key = "Path" }

[targets.settings."General"]

[sections.general]
title = "general"
target = "settings.General"

[[sections.general.options]]
key = "PauseWhenUnfocused"
title = "PauseWhenUnfocused"
type = "bool"
default = false
emit = { key = "PauseWhenUnfocused" }

[[sections.general.options]]
key = "CheckForUpdates"
title = "CheckForUpdates"
type = "bool"
default = false
emit = { key = "CheckForUpdates" }
