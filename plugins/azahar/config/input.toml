[targets.settings]
output = { format = "ini", path = "qt-config.ini" }

[targets.settings."Controls"]

[input]
driver = "sdl2"
device = "guid:{guid},port:{index}"

[input.mapping]
"button.a" = "engine:sdl,controller:true,maptype:guid+port,{device},button:0"
"button.b" = "engine:sdl,controller:true,maptype:guid+port,{device},button:1"
"button.x" = "engine:sdl,controller:true,maptype:guid+port,{device},button:2"
"button.y" = "engine:sdl,controller:true,maptype:guid+port,{device},button:3"
"button.select" = "engine:sdl,controller:true,maptype:guid+port,{device},button:4"
"button.guide" = "engine:sdl,controller:true,maptype:guid+port,{device},button:5"
"button.start" = "engine:sdl,controller:true,maptype:guid+port,{device},button:6"
"button.clickl" = "engine:sdl,controller:true,maptype:guid+port,{device},button:7"
"button.clickr" = "engine:sdl,controller:true,maptype:guid+port,{device},button:8"
"button.l" = "engine:sdl,controller:true,maptype:guid+port,{device},button:9"
"button.r" = "engine:sdl,controller:true,maptype:guid+port,{device},button:10"
"directional.n" = "engine:sdl,controller:true,maptype:guid+port,{device},button:11"
"directional.s" = "engine:sdl,controller:true,maptype:guid+port,{device},button:12"
"directional.w" = "engine:sdl,controller:true,maptype:guid+port,{device},button:13"
"directional.e" = "engine:sdl,controller:true,maptype:guid+port,{device},button:14"
"analog.stick.left.x+" = "engine:sdl,controller:true,maptype:guid+port,{device},axis_x:0,axis_y:1"
"analog.stick.right.x+" = "engine:sdl,controller:true,maptype:guid+port,{device},axis_x:2,axis_y:3"

[input.layouts."3DS_LAYOUT"]
"button.a" = "button_a"
"button.b" = "button_b"
"button.x" = "button_x"
"button.y" = "button_y"
"button.select" = "button_select"
"button.start" = "button_start"
"button.l" = "button_l"
"button.r" = "button_r"
"directional.n" = "button_up"
"directional.s" = "button_down"
"directional.w" = "button_left"
"directional.e" = "button_right"
"analog.stick.left.x+" = "circle_pad"
"analog.stick.right.x+" = "c_stick"

[platforms.NINTENDO_3DS.ports.layout.0]
target = "settings.Controls"
layouts = ["3DS_LAYOUT"]
emit = {}
