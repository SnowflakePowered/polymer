[sections.filenames]
title = "Filenames"
target = "ini.Filenames"

[[sections.filenames.options]]
key = "bios"
title = "BIOS"
type = "string"
default = ""
emit = { key = "BIOS" }

[sections.memory_cards]
title = "Memory Cards"
target = "ini.MemoryCards"

[[sections.memory_cards.options]]
key = "slot1_enable"
title = "Slot 1 Enabled"
type = "bool"
default = true
emit = { key = "Slot1_Enable", bool_style = "lower" }

[[sections.memory_cards.options]]
key = "slot1_filename"
title = "Slot 1 Filename"
type = "string"
default = "Mcd001.ps2"
emit = { key = "Slot1_Filename" }

[[sections.memory_cards.options]]
key = "slot2_enable"
title = "Slot 2 Enabled"
type = "bool"
default = false
emit = { key = "Slot2_Enable", bool_style = "lower" }

[[sections.memory_cards.options]]
key = "slot2_filename"
title = "Slot 2 Filename"
type = "string"
default = "Mcd002.ps2"
emit = { key = "Slot2_Filename" }

[sections.input_sources]
title = "Input Sources"
