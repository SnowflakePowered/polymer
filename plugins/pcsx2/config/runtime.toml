type = "string"
default = "sstates"
emit = { key = "Savestates" }

[[sections.folders.options]]
key = "memory_cards"
title = "Memory Cards"
type = "string"
default = "memcards"
emit = { key = "MemoryCards" }

[[sections.folders.options]]
key = "logs"
title = "Logs"
type = "string"
default = "logs"
emit = { key = "Logs" }

[[sections.folders.options]]
key = "cheats"
title = "Cheats"
type = "string"
default = "cheats"
emit = { key = "Cheats" }

[[sections.folders.options]]
key = "patches"
title = "Patches"
type = "string"
default = "patches"
emit = { key = "Patches" }

[[sections.folders.options]]
key = "user_resources"
title = "User Resources"
type = "string"
default = "resources"
emit = { key = "UserResources" }

[[sections.folders.options]]
key = "cache"
title = "Cache"
type = "string"
default = "cache"
emit = { key = "Cache" }

[[sections.folders.options]]
key = "textures"
title = "Textures"
type = "string"
default = "textures"
emit = { key = "Textures" }

[[sections.folders.options]]
key = "input_profiles"
title = "Input Profiles"
type = "string"
default = "inputprofiles"
emit = { key = "InputProfiles" }

[[sections.folders.options]]
key = "videos"
title = "Videos"
type = "string"
default = "videos"
emit = { key = "Videos" }

[[sections.folders.options]]
key = "debugger_layouts"
title = "Debugger Layouts"
type = "string"
default = "debuggerlayouts"
emit = { key = "DebuggerLayouts" }

[[sections.folders.options]]
key = "debugger_settings"
title = "Debugger Settings"
type = "string"
default = "debuggersettings"
