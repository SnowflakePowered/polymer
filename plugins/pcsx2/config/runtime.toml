# Invocation-critical settings that PCSX2 does not declare through the core
# settings macros consumed by support/parse_config.py.

[targets.ini.UI]
[targets.ini.Folders]
[targets.ini.Filenames]
[targets.ini.MemoryCards]
[targets.ini.InputSources]

[sections.ui]
title = "UI"
target = "ini.UI"

[[sections.ui.options]]
key = "settings_version"
title = "Settings Version"
type = "int"
default = 1
emit = { key = "SettingsVersion" }

[[sections.ui.options]]
key = "setup_wizard_incomplete"
title = "Setup Wizard Incomplete"
type = "bool"
default = false
emit = { key = "SetupWizardIncomplete", bool_style = "lower" }

[[sections.ui.options]]
key = "render_to_separate_window"
title = "Render To Separate Window"
type = "bool"
default = true
emit = { key = "RenderToSeparateWindow", bool_style = "lower" }

[[sections.ui.options]]
key = "hide_main_window_when_running"
title = "Hide Main Window When Running"
type = "bool"
default = false
emit = { key = "HideMainWindowWhenRunning", bool_style = "lower" }

[sections.folders]
title = "Folders"
target = "ini.Folders"

[[sections.folders.options]]
key = "bios"
title = "BIOS"
type = "string"
default = "bios"
