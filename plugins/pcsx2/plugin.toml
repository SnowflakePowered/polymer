[plugin]
id = "pcsx2"
version = "0.0.1"
class = "emulator"
main = "pcsx2.ts"

[plugin.config]
bios = "D:\\bios\\ps2\\scph-39001.BIN"
memory_card_format = "pcsx2"

[emulator]
platforms = ["SONY_PS2"]


[emulator.configuration]
definitions = [
    "config/pcsx2.toml",
    "config/actions.toml",
    "config/input.toml",
    "config/runtime.toml",
    "config/sections/*.toml",
]
