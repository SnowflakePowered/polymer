[plugin]
id = "pcsx2"
version = "0.0.1"
class = "emulator"
api = "^0.1"
main = "pcsx2.ts"

[plugin.permissions.net]
allowed-hosts = ["emulator-index.polymer.gg", "github.com", "release-assets.githubusercontent.com", "jsr.io"]

[[plugin.caches]]
key = "runtime"
label = "PCSX2 Runtime"

[plugin.config]
memory_card_format = "pcsx2"

[plugin.config.channel]
display = "Update channel"
default = "stable"
choices = ["stable", "preview", "nightly"]

[emulator]
platforms = ["SONY_PS2"]


[emulator.configuration]
definitions = [
    "config/pcsx2.toml",
    "config/actions.toml",
    "config/input.toml",
    "config/runtime.toml",
    "config/sections/*.toml",
]
