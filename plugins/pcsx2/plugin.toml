[plugin]
id = "pcsx2"
version = "0.0.1"
class = "emulator"

[plugin.config]
bios = "D:\\bios\\ps2\\scph-39001.BIN"
[emulator]
platforms = ["SONY_PS2"]


[emulator.configuration]
definitions = [
    "config/pcsx2.toml",
    "config/input.toml",
    "config/sections/*.toml",
]
resolver = "config/resolvers.ts"
