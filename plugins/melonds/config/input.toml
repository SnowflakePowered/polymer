[targets.settings]
output = { format = "toml", path = "melonDS.toml" }

[targets.settings.Instance0.Joystick]

[input]
driver = "sdl2"
device = "{index}"

[input.mapping]
"button.a" = 0
"button.b" = 1
"button.x" = 2
"button.y" = 3
"button.select" = 4
"button.guide" = 5
"button.start" = 6
"button.clickl" = 7
"button.clickr" = 8
"button.l" = 9
"button.r" = 10
"directional.n" = 11
"directional.s" = 12
"directional.w" = 13
"directional.e" = 14

[input.layouts."NDS_LAYOUT"]
"button.a" = "A"
"button.b" = "B"
"button.x" = "X"
"button.y" = "Y"
"button.select" = "Select"
"button.start" = "Start"
"button.l" = "L"
"button.r" = "R"
"directional.n" = "Up"
"directional.s" = "Down"
"directional.w" = "Left"
"directional.e" = "Right"

[platforms.NINTENDO_NDS.ports.layout.0]
target = "settings.Instance0.Joystick"
layouts = ["NDS_LAYOUT"]
emit = {}
