[plugin]
id = "shiragame"
version = "0.1.0"
class = "scraper"
main = "shiragame.ts"

[plugin.permissions.net]
allowed-hosts = ["github.com", "release-assets.githubusercontent.com", "jsr.io"]

[[plugin.caches]]
key = "download"
label = "Shiragame Database"

[scraper]
requires = [
    "package.platform",
    "any(package.serial, package.hash.sha1, package.hash.md5, package.hash.crc32)",
    "any(package.platform, package.size)",
]
provides = ["media.cue"]
