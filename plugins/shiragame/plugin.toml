[plugin]
id = "shiragame"
version = "0.1.0"
class = "scraper"
main = "shiragame.ts"

[plugin.permissions.net]
allowed-hosts = ["github.com", "release-assets.githubusercontent.com", "jsr.io"]

[[plugin.caches]]
key = "download"
label = "Shiragame Database"

[scraper]
requires = [
    "package.platform",
    "any(package.serial, package.files)",
]
provides = ["media.cue", "meta.region", "meta.title"]
