[machine]
name = "Xbox 360"
id = "MICROSOFT_X360"

[meta]
short-name = "X360"
licensor = "Microsoft"
manufacturer = "Microsoft"
type = "console"

[meta.na]
release-date = "2005-11-22"

[input]
groups = ["controller", "usb"]

[input.controller]
inputs = ["XBOX_CONTROLLER"]
ports = 4

[input.usb]
accessories = true

[accessories]
class = [
    "disney_infinity",
    "skylander",
    "lego_dimensions",
    "guitar",
    "piano",
    "drums",
    "keyboard",
    "camera",
    "microphone",
    "storage"
]
