name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            packages: --workspace
          - name: macOS
            os: macos-latest
            packages: -p polymer-gui -p polymer-hook-metal -p polymer-hook-appkit -p polymer-hook-sdl3
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - if: runner.os == 'Windows'
        uses: ./.github/actions/windows-deps
      - if: runner.os == 'macOS'
        run: |
          brew install sdl3
          echo "LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy
      - run: cargo clippy ${{ matrix.packages }} --all-targets -- -D warnings

  test:
    name: Build and test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            packages: --workspace
          - name: macOS
            os: macos-latest
            packages: -p polymer-gui -p polymer-hook-metal -p polymer-hook-appkit -p polymer-hook-sdl3 -p polymer-tests
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - if: runner.os == 'Windows'
        uses: ./.github/actions/windows-deps
      - if: runner.os == 'macOS'
        run: |
          brew install sdl3
          echo "LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
      - run: cargo build ${{ matrix.packages }}
      - run: cargo test ${{ matrix.packages }}

  installer:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/windows-deps
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: installer
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: Add-Content $env:GITHUB_PATH (Join-Path $env:USERPROFILE '.dotnet\tools')
      - run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Polymer-win-Setup
          path: target/velopack/releases/Polymer-win-Setup.exe
          if-no-files-found: error
